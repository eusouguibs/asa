# Mantém o banco de dados (Supabase grátis) acordado.
# O plano grátis pausa o projeto depois de 7 dias sem uso; isto faz uma consulta a cada 2 dias.
name: Manter o Asa ativo
on:
  schedule:
    - cron: '17 12 */2 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta rápida no banco
        run: |
          curl -sS -o /dev/null -w "%{http_code}\n" \
            "https://mxyvhrfvlgletxvvbkdy.supabase.co/rest/v1/ministries?select=id&limit=1" \
            -H "apikey: sb_publishable_7R0EcMgzfW66AnvwQFbQvw_VZ8P1-da"
